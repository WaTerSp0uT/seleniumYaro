# Visual baseline update
# Supported values: true, false
visualBaselineUpdate=false
# true updates expected visual baseline images; false keeps existing baselines

# Playwright execution options
# Supported browser values: chromium, chrome, edge, firefox, webkit
playwrightBrowserType=firefox
# Browser to launch: chromium, chrome, edge, firefox, or webkit
playwrightHeadless=false
# true runs browser in background; false opens visible browser
playwrightSlowMo=0
# Delay between Playwright actions in milliseconds; useful for debugging
playwrightTimeout=30000
# Default Playwright wait timeout in milliseconds
playwrightViewportWidth=1920
# Browser viewport width
playwrightViewportHeight=1080
# Browser viewport height
playwrightAcceptDownloads=true
# true allows tests to capture downloaded files
playwrightTrace=false
# true records Playwright trace zip for debugging failures
playwrightScreenshotOnStep=failed
# Screenshot mode: failed, always, or none


# DB CONNECTIONS
db.url=jdbc:mysql://localhost:3306/mydb
# Database connection URL
db.username=testuser
# Database username
db.password=password
# Database password
db.driver=com.mysql.cj.jdbc.Driver
# JDBC driver class name

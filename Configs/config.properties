# Visual baseline update
# Supported values: true, false
visualBaselineUpdate=false

# Playwright execution options
# Supported browser values: chromium, chrome, edge, firefox, webkit
playwrightBrowserType=firefox
playwrightHeadless=false
playwrightSlowMo=0
playwrightTimeout=30000
playwrightViewportWidth=1920
playwrightViewportHeight=1080
playwrightAcceptDownloads=true
playwrightTrace=false
playwrightScreenshotOnStep=failed


# DB CONNECTIONS
db.url=jdbc:mysql://localhost:3306/mydb
db.username=testuser
db.password=password
db.driver=com.mysql.cj.jdbc.Driver
